<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftRogue 2.5D - 三系流派大更新</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  body {
    margin: 0; background: #121212; color: #fff;
    font-family: 'Courier New', monospace; overflow: hidden;
    display: flex; justify-content: center; align-items: center; height: 100vh;
    user-select: none;
  }
  #gameContainer { position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.9); border: 4px solid #2e2e2e; }
  canvas { display: block; background: #4b702c; cursor: crosshair; }
  
  /* 顶部 HUD */
  #hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    pointer-events: none; display: none; justify-content: space-between;
    text-shadow: 2px 2px 0 #000; font-weight: bold; font-size: 15px; z-index: 10;
  }
  .bar-bg { width: 220px; height: 16px; background: #222; border: 2px solid #000; margin-top: 4px; position: relative; }
  #hpBar { height: 100%; background: #e53935; width: 100%; transition: width 0.1s; }
  #xpBar { height: 100%; background: #76ff03; width: 0%; transition: width 0.1s; }
  
  #centerStatus {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none;
  }
  #breakTimerDisplay {
    font-size: 20px; color: #ffeb3b; text-shadow: 2px 2px #000;
    background: rgba(0,0,0,0.6); padding: 6px 16px; border: 2px solid #ffeb3b; border-radius: 4px;
    display: none; margin-bottom: 6px;
  }

  .top-right-controls { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-bottom: 6px; }
  .room-badge {
    background: rgba(0,0,0,0.65); padding: 5px 10px; border: 2px solid #76ff03;
    color: #76ff03; font-size: 15px; pointer-events: auto; cursor: pointer;
  }
  .room-badge:hover { background: rgba(118, 255, 3, 0.2); }
  .hud-btn {
    background: #424242; color: #fff; border: 2px solid #fff; padding: 5px 12px;
    font-family: inherit; font-weight: bold; font-size: 14px; cursor: pointer;
    pointer-events: auto; transition: 0.1s;
  }
  .hud-btn:hover { background: #616161; border-color: #ffeb3b; color: #ffeb3b; }

  /* 弹窗通用样式 */
  .modal {
    position: absolute; inset: 0; background: rgba(0,0,0,0.86);
    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20;
  }
  .modal-title { font-size: 28px; color: #ffeb3b; text-shadow: 3px 3px #000; margin-bottom: 18px; font-weight: bold; }
  .lobby-box {
    background: #2c2c2c; border: 3px solid #666; padding: 24px 32px;
    display: flex; flex-direction: column; gap: 14px; width: 350px; text-align: center;
    box-shadow: 0 8px 0 #111;
  }
  .input-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .input-group label { font-size: 13px; color: #bbb; }
  input {
    padding: 10px; font-size: 16px; background: #1a1a1a; border: 2px solid #555;
    color: #fff; font-family: inherit; text-align: center; font-weight: bold;
  }
  input:focus { outline: none; border-color: #76ff03; }
  .btn {
    padding: 11px 20px; background: #4caf50; border: 3px solid #fff;
    color: #fff; font-size: 16px; cursor: pointer; font-weight: bold;
    font-family: inherit; transition: 0.1s;
  }
  .btn:hover { background: #66bb6a; transform: translateY(-2px); }
  .btn-blue { background: #0288d1; }
  .btn-blue:hover { background: #03a9f4; }
  .btn-purple { background: #7b1fa2; font-size: 14px; padding: 8px 14px; }
  .btn-purple:hover { background: #9c27b0; }
  .kick-btn {
    background: #d32f2f; color: #fff; border: 1px solid #b71c1c; border-radius: 3px;
    cursor: pointer; padding: 4px 8px; font-size: 12px; margin-left: 8px;
    font-family: inherit; font-weight: bold; transition: 0.1s; pointer-events: auto;
  }
  .kick-btn:hover { background: #f44336; }

  #statusMsg { color: #ffeb3b; font-size: 13px; min-height: 18px; margin-top: 4px; line-height: 1.4; }

  /* 房间等候室 */
  .code-row { display: flex; gap: 8px; align-items: stretch; }
  .code-highlight {
    flex: 1; font-size: 26px; color: #76ff03; background: #1a1a1a; border: 2px dashed #76ff03;
    padding: 6px; letter-spacing: 4px; user-select: text; display: flex; align-items: center; justify-content: center;
  }
  .player-list {
    background: #1e1e1e; border: 2px solid #444; padding: 10px;
    min-height: 110px; max-height: 160px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; text-align: left;
  }
  .player-item {
    background: #2e2e2e; padding: 6px 10px; border-left: 4px solid #76ff03;
    font-size: 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .player-item.client { border-left-color: #00e5ff; }

  #waitingModal, #pauseModal, #upgradeModal, #gameOverModal { display: none; }
  #upgradeModal { background: rgba(0,0,0,0.65); }

  /* 附魔卡片：支持多张掉落武器卡片自动换行 */
  .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 850px; }
  .card {
    background: #373737; border: 3px solid #8b8b8b; width: 175px; padding: 16px;
    cursor: pointer; text-align: center; transition: 0.15s; box-shadow: 0 6px 0 #1b1b1b;
    pointer-events: auto; display: flex; flex-direction: column; justify-content: center;
  }
  .card:hover { border-color: #76ff03; transform: translateY(-5px); background: #4a4a4a; }
  .card.weapon-card { border-color: #ff9800; background: #4e342e; }
  .card.weapon-card:hover { border-color: #ffeb3b; background: #5d4037; }
  .card h3 { margin: 0 0 10px 0; color: #b388ff; font-size: 18px; }
  .card.weapon-card h3 { color: #ffeb3b; }
  .card p { font-size: 13px; color: #ddd; margin: 0; line-height: 1.4; }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="canvas" width="960" height="600"></canvas>
  
  <div id="hud">
    <div>
      <div>❤️ 我的生命: <span id="hpText">100/100</span></div>
      <div class="bar-bg"><div id="hpBar"></div></div>
      <div style="margin-top:6px;">✨ 我的等级: <span id="lvlText">1</span></div>
      <div class="bar-bg"><div id="xpBar"></div></div>
    </div>
    
    <div id="centerStatus">
      <div id="breakTimerDisplay">☕ 休整倒计时: 50s</div>
      <button class="hud-btn" id="skipBreakBtn" style="display:none; background:#ff9800; border-color:#fff;">⏩ 房主跳过休整</button>
    </div>

    <div style="text-align: right;">
      <div class="top-right-controls">
        <div class="room-badge" id="roomCodeDisplay" title="点击复制邀请链接">🔑 房间: ------ (复制)</div>
        <button class="hud-btn" id="pauseBtn">⏸️ 暂停(P)</button>
      </div>
      <div>👥 存活: <span id="playerCountText">1</span> | ⚔️ 波次: <span id="waveText">1</span> | 💀 击杀: <span id="killText">0</span></div>
      <div style="font-size:12px; color:#ddd; margin-top:4px;">WASD移动 | 左键攻击/召唤物突进</div>
    </div>
  </div>

  <div id="lobbyModal" class="modal">
    <div class="modal-title">⛏️ CraftRogue 2.5D (流派更新版)</div>
    <div class="lobby-box">
      <div class="input-group">
        <label>你的头顶昵称：</label>
        <input type="text" id="nicknameInput" value="Steve" maxlength="12">
      </div>
      <button class="btn" id="hostBtn">👑 创建新房间 (我是房主)</button>
      <div class="divider" style="margin: 8px 0;"></div>
      <div class="input-group">
        <label>输入房主的 6 位数字密码：</label>
        <input type="text" id="roomCodeInput" placeholder="例如: 123456" maxlength="6">
      </div>
      <button class="btn btn-blue" id="joinBtn">🔗 加入好友房间</button>
      <div id="statusMsg">准备就绪，请选择创建或加入房间</div>
    </div>
  </div>

  <div id="waitingModal" class="modal">
    <div class="modal-title">🏕️ 房间准备大厅</div>
    <div class="lobby-box" style="width: 390px;">
      <div style="font-size:13px; color:#bbb;">房间密码（或直接复制邀请链接发给好友）：</div>
      <div class="code-row">
        <div class="code-highlight" id="waitingRoomCode">------</div>
        <button class="btn btn-purple" id="copyLinkBtn">📋 复制链接</button>
      </div>
      <div class="input-group">
        <label>当前房间内的玩家 (<span id="lobbyPlayerCount">1</span>人)：</label>
        <div class="player-list" id="lobbyPlayerList"></div>
      </div>
      <button class="btn" id="startGameBtn">🚀 开始游戏 (Start Game)</button>
      <div id="waitingHint" style="font-size:13px; color:#ffeb3b; display:none;">⏳ 等待房主点击开始游戏...</div>
    </div>
  </div>

  <div id="pauseModal" class="modal">
    <div class="modal-title">⏸️ 游戏已暂停</div>
    <div class="lobby-box" style="width: 300px;">
      <p id="pauseDesc" style="margin: 0 0 10px 0; color: #ccc; font-size: 14px;">全队时间和怪物动作已冻结</p>
      <button class="btn" id="resumeBtn">▶️ 继续游戏 (P)</button>
      <button class="btn" style="background:#d32f2f; margin-top:6px;" onclick="window.location.href=window.location.pathname">🚪 退出房间</button>
    </div>
  </div>

  <div id="upgradeModal" class="modal">
    <div class="modal-title" id="upgradeTitle">📖 升级奖励：选择一项个人强化/武器</div>
    <div class="cards" id="cardContainer"></div>
  </div>

  <div id="gameOverModal" class="modal">
    <div class="modal-title" style="color:#ff5252;">全军覆没 (Team Wiped!)</div>
    <p id="finalScore" style="font-size:18px;"></p>
    <button class="btn" onclick="window.location.href=window.location.pathname">返回大厅</button>
  </div>
</div>

<script>
window.onload = function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusMsg = document.getElementById('statusMsg');

  const peerConfig = {
    config: {
      'iceServers': [
        { urls: 'stun:stun.miwifi.com:3478' },
        { urls: 'stun:stun.qq.com:3478' },
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun.stunprotocol.org:3478' }
      ]
    }
  };

  const ROOM_PREFIX = 'craftrogue-25d-v3-room-';
  let peer = null, isHost = false, myId = 'host', roomCode = '';
  let hostConn = null;
  const clientConns = {};
  const remoteInputs = {};

  const urlParams = new URLSearchParams(window.location.search);
  const invitedRoom = urlParams.get('room');
  if (invitedRoom && invitedRoom.length === 6) {
    document.getElementById('roomCodeInput').value = invitedRoom;
    document.getElementById('nicknameInput').value = 'Alex';
    statusMsg.innerHTML = '✨ 已识别邀请房间 <strong>' + invitedRoom + '</strong>！<br>直接点击加入';
  }

  function copyInviteLink(btnEl) {
    const inviteUrl = window.location.origin + window.location.pathname + '?room=' + roomCode;
    navigator.clipboard.writeText(inviteUrl).then(() => {
      const oldText = btnEl.innerText; btnEl.innerText = '✅ 已复制!';
      setTimeout(() => btnEl.innerText = oldText, 2000);
    }).catch(() => prompt('复制以下链接：', inviteUrl));
  }
  document.getElementById('copyLinkBtn').onclick = function() { copyInviteLink(this); };
  document.getElementById('roomCodeDisplay').onclick = function() { copyInviteLink(this); };

  const keys = {};
  const mouse = { x: 480, y: 300, down: false };
  let gameStarted = false, isManualPaused = false, walkTick = 0;

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if ((e.code === 'KeyP' || e.code === 'Escape') && gameStarted && document.getElementById('upgradeModal').style.display !== 'flex') {
      if (isHost) toggleManualPause();
    }
  });
  window.addEventListener('keyup', e => keys[e.code] = false);
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
  });
  canvas.addEventListener('mousedown', () => mouse.down = true);
  window.addEventListener('mouseup', () => mouse.down = false);

  // ==========================================
  // 流派武器与卡池定义
  // ==========================================
  const WEAPONS = {
    sword: [
      { name: '木剑', dmg: 18, cd: 24, range: 75, arc: 0.7 },
      { name: '石剑', dmg: 25, cd: 22, range: 80, arc: 0.8 },
      { name: '铁剑', dmg: 35, cd: 20, range: 85, arc: 0.9 },
      { name: '钻石剑', dmg: 50, cd: 18, range: 90, arc: 1.0 }
    ],
    bow: [
      { name: '木弓', dmg: 20, cd: 32, speed: 8.5 },
      { name: '重弩', dmg: 40, cd: 24, speed: 13 }
    ],
    staff: [
      { name: '召唤法杖', dmg: 35, cd: 35 } // 法杖自身的基础伤害参数给狗使用
    ]
  };

  const ALL_CARDS = {
    'enc_0': { name: "锋利 (Sharpness)", desc: "提升全部武器基础伤害 +16", apply: (p) => p.dmgBonus += 16 },
    'enc_1': { name: "横扫/狙击", desc: "提升攻击范围、距离与狗的索敌", apply: (p) => { p.rangeBonus += 18; p.arcBonus += 0.22; } },
    'enc_2': { name: "击退 (Knockback)", desc: "所有武器击飞力度提升", apply: (p) => p.kbBonus += 6 },
    'enc_3': { name: "急迫 (Haste)", desc: "攻击/召唤突进冷却缩短 18%", apply: (p) => p.cdMult *= 0.82 },
    'enc_4': { name: "迅捷药水 (Speed)", desc: "人物移动速度 +0.55", apply: (p) => p.speedBonus += 0.55 },
    'enc_5': { name: "金苹果 (G-Apple)", desc: "最大生命+30, 恢复60血", apply: (p) => { p.maxHpBonus += 30; p.maxHp = 100 + p.maxHpBonus; p.hp = Math.min(p.maxHp, p.hp + 60); } },
    
    // 怪物掉落与隐藏流派专属卡牌
    'sword_1': { isWeapon: true, name: "🗡️ 换武器：石剑", desc: "基础伤害 25，攻速微升", apply: (p) => { p.weaponType = 'sword'; p.weaponTier = 1; } },
    'sword_2': { isWeapon: true, name: "🗡️ 换武器：铁剑", desc: "基础伤害 35，范围扩大", apply: (p) => { p.weaponType = 'sword'; p.weaponTier = 2; } },
    'sword_3': { isWeapon: true, name: "🗡️ 换武器：钻石剑", desc: "基础伤害 50，攻速极快", apply: (p) => { p.weaponType = 'sword'; p.weaponTier = 3; } },
    'bow_0':   { isWeapon: true, name: "🏹 换武器：木弓", desc: "改为远程射击流派，基础伤害 20", apply: (p) => { p.weaponType = 'bow'; p.weaponTier = 0; } },
    'bow_1':   { isWeapon: true, name: "🏹 换武器：重弩", desc: "高伤害高弹速远程，基础伤害 40", apply: (p) => { p.weaponType = 'bow'; p.weaponTier = 1; } },
    'staff_0': { isWeapon: true, name: "🔮 隐藏流派：召唤法杖", desc: "召唤无敌猎犬跟随，点击鼠标指挥猎犬突进撕咬大范围敌人！", apply: (p) => { 
      p.weaponType = 'staff'; p.weaponTier = 0; 
      if (!p.dog) p.dog = { x: p.x, y: p.y, z: 0, state: 'idle', timer: 0, angle: 0 }; 
    } }
  };

  let teamState = { state: 'LOBBY', wave: 1, kills: 0, breakTimer: 0, spawnedThisWave: 0, targetSpawns: 10 };
  let players = {}, enemies = [], projectiles = [], xpOrbs = [], particles = [];
  const obstacles = [
    { x: 220, y: 180, w: 44, d: 34, h: 48, type: 'tree' }, { x: 740, y: 190, w: 46, d: 36, h: 52, type: 'pillar' },
    { x: 260, y: 440, w: 46, d: 36, h: 52, type: 'pillar' }, { x: 700, y: 430, w: 44, d: 34, h: 48, type: 'tree' }
  ];

  function createPlayerObj(id, name, skinIndex) {
    return {
      id, name, skin: skinIndex % 2 === 0 ? 'steve' : 'alex',
      x: 440 + (Math.random() * 80 - 40), y: 280 + (Math.random() * 60 - 30),
      z: 0, vz: 0, radius: 14, hp: 100, maxHp: 100,
      cooldownTimer: 0, swingAnim: 0, angle: 0, bob: 0, reviveTimer: 0,
      // 个人流派与属性
      weaponType: 'sword', weaponTier: 0, unlockedWeapons: [], dog: null,
      lvl: 1, xp: 0, maxXp: 5, pendingUpgrades: 0,
      dmgBonus: 0, rangeBonus: 0, arcBonus: 0, kbBonus: 0, cdMult: 1, speedBonus: 0, maxHpBonus: 0
    };
  }

  window.kickPlayer = function(targetPeerId) {
    if (!isHost) return;
    const targetConn = clientConns[targetPeerId];
    if (targetConn) {
      if (targetConn.open) targetConn.send({ type: 'kicked' });
      setTimeout(() => { targetConn.close(); delete clientConns[targetPeerId]; delete remoteInputs[targetPeerId]; delete players[targetPeerId]; broadcastLobbyState(); }, 100);
    } else {
      delete clientConns[targetPeerId]; delete remoteInputs[targetPeerId]; delete players[targetPeerId]; broadcastLobbyState();
    }
  };

  function renderWaitingRoomList() {
    const listEl = document.getElementById('lobbyPlayerList');
    const pArr = Object.values(players);
    document.getElementById('lobbyPlayerCount').innerText = pArr.length;
    listEl.innerHTML = '';
    pArr.forEach(p => {
      const isPlayerHost = (p.id === 'host');
      const item = document.createElement('div');
      item.className = 'player-item' + (isPlayerHost ? '' : ' client');
      let kickBtnHtml = (isHost && !isPlayerHost) ? `<button class="kick-btn" onclick="kickPlayer('${p.id}')">踢出</button>` : '';
      item.innerHTML = `<span><strong>${p.name}</strong>${p.id === myId ? ' (我)' : ''}</span> 
        <div style="display:flex; align-items:center;"><span style="color:#aaa;font-size:12px;">[${p.skin === 'alex'?'Alex':'Steve'}] ${isPlayerHost ? '👑 房主' : '🎮 队员'}</span>${kickBtnHtml}</div>`;
      listEl.appendChild(item);
    });
  }

  function broadcastLobbyState() {
    renderWaitingRoomList();
    Object.values(clientConns).forEach(conn => { if (conn.open) conn.send({ type: 'lobby_update', players, gameStarted }); });
  }

  function openWaitingRoomUI(code) {
    document.getElementById('lobbyModal').style.display = 'none';
    document.getElementById('waitingModal').style.display = 'flex';
    document.getElementById('waitingRoomCode').innerText = code;
    document.getElementById('startGameBtn').style.display = isHost ? 'block' : 'none';
    document.getElementById('waitingHint').style.display = isHost ? 'none' : 'block';
    renderWaitingRoomList();
  }

  function startActualGameUI() {
    gameStarted = true;
    document.getElementById('lobbyModal').style.display = 'none';
    document.getElementById('waitingModal').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    if (!isHost) document.getElementById('pauseBtn').style.display = 'none';
  }

  document.getElementById('startGameBtn').onclick = () => {
    if (!isHost) return;
    startActualGameUI();
    teamState.state = 'PLAYING'; teamState.wave = 1; teamState.spawnedThisWave = 0; teamState.targetSpawns = 8 + Object.keys(players).length * 4;
    Object.values(clientConns).forEach(conn => { if (conn.open) conn.send({ type: 'start_game', players }); });
  };

  document.getElementById('skipBreakBtn').onclick = () => { if (isHost && teamState.state === 'BREAK') teamState.breakTimer = 0; };

  function toggleManualPause() {
    if (!isHost || !gameStarted) return;
    isManualPaused = !isManualPaused; updatePauseModalUI();
    Object.values(clientConns).forEach(conn => { if (conn.open) conn.send({ type: 'pause_state', isManualPaused }); });
  }

  function updatePauseModalUI() {
    const modal = document.getElementById('pauseModal');
    if (isManualPaused) {
      modal.style.display = 'flex'; document.getElementById('resumeBtn').style.display = isHost ? 'block' : 'none';
      document.getElementById('pauseDesc').innerText = isHost ? '你已暂停游戏' : '⏳ 房主已暂停游戏...';
    } else modal.style.display = 'none';
  }

  document.getElementById('pauseBtn').onclick = () => toggleManualPause();
  document.getElementById('resumeBtn').onclick = () => toggleManualPause();

  // ==========================================
  // 联机握手
  // ==========================================
  document.getElementById('hostBtn').onclick = () => {
    if (typeof Peer === 'undefined') { statusMsg.innerText = '❌ PeerJS 加载失败'; return; }
    const name = document.getElementById('nicknameInput').value.trim() || 'Steve';
    roomCode = Math.floor(100000 + Math.random() * 900000).toString();
    statusMsg.innerText = '创建通道中...';
    peer = new Peer(ROOM_PREFIX + roomCode, peerConfig);
    peer.on('open', () => {
      isHost = true; myId = 'host'; players[myId] = createPlayerObj(myId, name, 0); openWaitingRoomUI(roomCode);
    });
    peer.on('connection', conn => {
      conn.on('open', () => {
        clientConns[conn.peer] = conn; remoteInputs[conn.peer] = { mx: 0, my: 0, jump: false, attack: false, angle: 0, mouseX: 0, mouseY: 0 };
        players[conn.peer] = createPlayerObj(conn.peer, '连接中...', Object.keys(players).length); broadcastLobbyState();
      });
      conn.on('data', data => {
        if (data.type === 'join_info' && players[conn.peer]) { players[conn.peer].name = data.name; broadcastLobbyState(); if (gameStarted) conn.send({ type: 'start_game', players }); }
        else if (data.type === 'input') { remoteInputs[conn.peer] = data.state; }
        else if (data.type === 'select_enchant') { applyEnchant(conn.peer, data.cardId); }
      });
      conn.on('close', () => { delete clientConns[conn.peer]; delete remoteInputs[conn.peer]; delete players[conn.peer]; broadcastLobbyState(); });
    });
  };

  document.getElementById('joinBtn').onclick = () => {
    if (typeof Peer === 'undefined') return;
    const code = document.getElementById('roomCodeInput').value.trim();
    if (code.length !== 6) { statusMsg.innerText = '⚠️ 请输入 6 位密码！'; return; }
    const name = document.getElementById('nicknameInput').value.trim() || 'Alex';
    statusMsg.innerText = '正在尝试穿透连接...';
    peer = new Peer(peerConfig);
    peer.on('open', id => {
      myId = id; roomCode = code; hostConn = peer.connect(ROOM_PREFIX + code, { reliable: false });
      hostConn.on('open', () => { isHost = false; hostConn.send({ type: 'join_info', name: name }); openWaitingRoomUI(code); });
      hostConn.on('data', msg => {
        if (msg.type === 'lobby_update') { players = msg.players; renderWaitingRoomList(); if (msg.gameStarted && !gameStarted) startActualGameUI(); }
        else if (msg.type === 'start_game') { players = msg.players; startActualGameUI(); }
        else if (msg.type === 'pause_state') { isManualPaused = msg.isManualPaused; updatePauseModalUI(); }
        else if (msg.type === 'sync') {
          players = msg.players; enemies = msg.enemies; projectiles = msg.projectiles; xpOrbs = msg.xpOrbs; teamState = msg.teamState;
          if (msg.events) msg.events.forEach(ev => addLocalParticles(ev.x, ev.y, ev.z, ev.color, ev.count, ev.speed)); updateHUD();
        }
        else if (msg.type === 'show_upgrade_modal') showUpgradeModalClient(msg.cardIds);
        else if (msg.type === 'close_upgrade_modal') document.getElementById('upgradeModal').style.display = 'none';
        else if (msg.type === 'game_over') { document.getElementById('finalScore').innerText = '小队倒在了第 ' + teamState.wave + ' 波'; document.getElementById('gameOverModal').style.display = 'flex'; }
        else if (msg.type === 'kicked') { alert('你已被房主移出该房间。'); window.location.href = window.location.pathname; }
      });
      hostConn.on('close', () => { alert('与房主的连接已断开！'); window.location.href = window.location.pathname; });
    });
  };

  // ==========================================
  // 房主核心逻辑 (武器战斗、召唤狗与掉落)
  // ==========================================
  let pendingParticleEvents = [];
  function broadcastParticles(x, y, z, color, count, speed) {
    addLocalParticles(x, y, z, color, count, speed);
    if (isHost) pendingParticleEvents.push({ x: Math.round(x), y: Math.round(y), z: Math.round(z), color, count, speed });
  }

  function addLocalParticles(x, y, z, color, count, speed) {
    count = count || 8; speed = speed || 4;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2; const s = Math.random() * speed + 1;
      particles.push({ x, y, z: z + 10, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: Math.random() * 5 + 2, color, life: 22 + Math.random() * 12 });
    }
  }

  function spawnEnemy() {
    if (!isHost || !gameStarted || isManualPaused || teamState.state !== 'PLAYING') return;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * canvas.width; y = -20; }
    else if (edge === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
    else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
    else { x = -20; y = Math.random() * canvas.height; }

    let type = 'zombie';
    const rand = Math.random();
    if (rand > 0.78) type = 'creeper'; else if (rand > 0.52) type = 'skeleton';

    const pMult = 1 + (Object.keys(players).length - 1) * 0.35;
    const scale = (1 + (teamState.wave - 1) * 0.15) * pMult;
    const configs = {
      zombie: { hp: Math.round(55 * scale), speed: 1.45, radius: 13 },
      skeleton: { hp: Math.round(38 * scale), speed: 1.25, radius: 12, shootTimer: 90 },
      creeper: { hp: Math.round(45 * scale), speed: 1.85, radius: 13, fuse: 0 }
    };
    enemies.push({ x, y, z: 0, vx: 0, vy: 0, vz: 0, type, ...configs[type], maxHp: configs[type].hp, hitFlash: 0, animOffset: Math.floor(Math.random()*100) });
  }

  setInterval(() => {
    if (isHost && gameStarted && !isManualPaused && teamState.state === 'PLAYING') {
      if (teamState.spawnedThisWave < teamState.targetSpawns) {
        const batch = Math.min(teamState.targetSpawns - teamState.spawnedThisWave, 2 + Math.floor(teamState.wave/2) + Object.keys(players).length);
        for (let i = 0; i < batch; i++) { spawnEnemy(); teamState.spawnedThisWave++; }
      }
    }
  }, 2500);

  function resolveObstacleCollision(entity) {
    obstacles.forEach(ob => {
      const halfW = ob.w / 2 + (entity.radius || 13); const halfD = ob.d / 2 + (entity.radius || 13);
      const dx = entity.x - ob.x, dy = entity.y - (ob.y - ob.d * 0.2);
      if (Math.abs(dx) < halfW && Math.abs(dy) < halfD) {
        const overlapX = halfW - Math.abs(dx), overlapY = halfD - Math.abs(dy);
        if (overlapX < overlapY) entity.x += dx > 0 ? overlapX : -overlapX; else entity.y += dy > 0 ? overlapY : -overlapY;
      }
    });
  }

  function getNearestAlivePlayer(x, y) {
    let nearest = null, minDist = Infinity;
    Object.values(players).forEach(p => {
      if (p.hp > 0) { const d = Math.hypot(p.x - x, p.y - y); if (d < minDist) { minDist = d; nearest = p; } }
    });
    return { target: nearest, dist: minDist };
  }

  // 玩家攻击派发 (剑/弓/狗)
  function performPlayerAttack(p, inp) {
    if (p.cooldownTimer > 0 || p.hp <= 0) return;
    const wep = WEAPONS[p.weaponType][p.weaponTier];
    p.cooldownTimer = Math.max(5, Math.floor(wep.cd * p.cdMult));
    p.swingAnim = 10;

    const dmg = wep.dmg + p.dmgBonus;
    const kb = (p.weaponType === 'sword' ? 11 : 6) + p.kbBonus;

    if (p.weaponType === 'sword') {
      const range = wep.range + p.rangeBonus, arc = Math.PI * wep.arc + p.arcBonus;
      enemies.forEach(e => {
        const dx = e.x - p.x, dy = e.y - p.y;
        if (Math.hypot(dx, dy) <= range + (e.radius || 13)) {
          let angleDiff = Math.atan2(dy, dx) - p.angle;
          while (angleDiff > Math.PI) angleDiff -= Math.PI * 2; while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
          if (Math.abs(angleDiff) <= arc / 2) {
            e.hp -= dmg; e.hitFlash = 7; e.lastHitBy = p.id;
            const kbAngle = Math.atan2(dy, dx); e.vx = Math.cos(kbAngle) * kb; e.vy = Math.sin(kbAngle) * kb; e.vz = 4.5;
            broadcastParticles(e.x, e.y, 15, '#ff1744', 7, 3.5);
          }
        }
      });
    } else if (p.weaponType === 'bow') {
      // 发射友方弓箭弹幕
      projectiles.push({ x: p.x, y: p.y, z: p.z + 15, vx: Math.cos(p.angle)*wep.speed, vy: Math.sin(p.angle)*wep.speed, isFriendly: true, ownerId: p.id, dmg: dmg, kb: kb });
      broadcastParticles(p.x, p.y, 15, '#cfd8dc', 4, 2);
    } else if (p.weaponType === 'staff') {
      // 指挥小狗突进
      if (p.dog && p.dog.state === 'idle') {
        p.dog.state = 'attacking'; p.dog.tx = inp.mouseX; p.dog.ty = inp.mouseY;
        p.dog.timer = 18; p.dog.dmg = dmg; p.dog.kb = kb + 3;
      }
    }
  }

  function explodeCreeper(c) {
    broadcastParticles(c.x, c.y, 15, '#ff9800', 30, 7); broadcastParticles(c.x, c.y, 20, '#ffffff', 15, 5);
    const radius = 115;
    Object.values(players).forEach(p => { if (p.hp > 0 && Math.hypot(p.x - c.x, p.y - c.y) < radius) { p.hp -= 35; p.vz = 6; } });
    enemies.forEach(e => { if (e !== c && Math.hypot(e.x - c.x, e.y - c.y) < radius) { e.hp -= 85; e.vz = 7; e.hitFlash = 10; } });
  }

  // --- 发放卡片选项 (掉落卡自动塞入列队) ---
  function triggerUpgradesForEveryone() { Object.values(players).forEach(p => sendUpgradeOptionsToPlayer(p.id)); }

  function sendUpgradeOptionsToPlayer(playerId) {
    const p = players[playerId];
    if (p.pendingUpgrades > 0) {
      const baseKeys = ['enc_0', 'enc_1', 'enc_2', 'enc_3', 'enc_4', 'enc_5'];
      let options = baseKeys.sort(() => 0.5 - Math.random()).slice(0, 3);
      // 8% 隐藏流派法杖彩蛋
      if (p.weaponType !== 'staff' && Math.random() < 0.08) { options[Math.floor(Math.random()*3)] = 'staff_0'; }
      
      // 加入这波打出的所有额外掉落武器卡，然后清空掉落池
      p.unlockedWeapons.forEach(w => options.push(w));
      p.unlockedWeapons = [];

      if (playerId === myId) showUpgradeModalClient(options);
      else if (clientConns[playerId]) clientConns[playerId].send({ type: 'show_upgrade_modal', cardIds: options });
    } else {
      if (playerId === myId) document.getElementById('upgradeModal').style.display = 'none';
      else if (clientConns[playerId]) clientConns[playerId].send({ type: 'close_upgrade_modal' });
    }
  }

  function showUpgradeModalClient(cardIds) {
    const modal = document.getElementById('upgradeModal');
    const container = document.getElementById('cardContainer');
    container.innerHTML = '';
    cardIds.forEach(id => {
      const enc = ALL_CARDS[id];
      if (!enc) return;
      const card = document.createElement('div');
      card.className = 'card' + (enc.isWeapon ? ' weapon-card' : '');
      card.innerHTML = `<h3>${enc.name}</h3><p>${enc.desc}</p>`;
      card.onclick = () => {
        modal.style.display = 'none';
        if (isHost) applyEnchant(myId, id); else hostConn.send({ type: 'select_enchant', cardId: id });
      };
      container.appendChild(card);
    });
    modal.style.display = 'flex';
  }

  function applyEnchant(playerId, cardId) {
    const p = players[playerId];
    if (!p || p.pendingUpgrades <= 0) return;
    const enc = ALL_CARDS[cardId];
    if (enc) {
      enc.apply(p); p.pendingUpgrades--;
      sendUpgradeOptionsToPlayer(playerId); // 继续弹直到清空
    }
  }

  function getLocalInput(p) {
    let mx = 0, my = 0;
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (mx !== 0 && my !== 0) { mx *= 0.707; my *= 0.707; }
    // 注意：加入 mouseX, mouseY 用于指挥狗突进坐标
    return { mx, my, jump: !!keys['Space'], attack: !!mouse.down, angle: Number((p ? Math.atan2(mouse.y - (p.y - 20), mouse.x - p.x) : 0).toFixed(2)), mouseX: mouse.x, mouseY: mouse.y };
  }

  // --- 主循环更新 ---
  let syncTick = 0;
  function update() {
    if (!gameStarted) return;
    if (!isManualPaused) walkTick++;

    if (!isManualPaused) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.z += pt.vz; pt.vz -= 0.35;
        if (pt.z < 0) { pt.z = 0; pt.vx *= 0.6; pt.vy *= 0.6; }
        pt.life--; if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    if (!isHost) {
      if (!isManualPaused && hostConn && hostConn.open && players[myId]) hostConn.send({ type: 'input', state: getLocalInput(players[myId]) });
      return;
    }

    if (isManualPaused) return;

    if (teamState.state === 'PLAYING') {
      if (teamState.spawnedThisWave >= teamState.targetSpawns && enemies.length === 0) {
        teamState.state = 'BREAK'; teamState.breakTimer = 50 * 60; 
        Object.values(players).forEach(p => { if (p.hp > 0) p.pendingUpgrades++; });
        triggerUpgradesForEveryone();
      }
    } else if (teamState.state === 'BREAK') {
      teamState.breakTimer--;
      if (teamState.breakTimer <= 0) {
        teamState.wave++; teamState.state = 'PLAYING'; teamState.spawnedThisWave = 0;
        teamState.targetSpawns = 8 + teamState.wave * 4 * Object.keys(players).length;
      }
    }

    remoteInputs[myId] = getLocalInput(players[myId]);
    let aliveCount = 0;

    Object.values(players).forEach(p => {
      if (p.hp <= 0) {
        p.hp = 0; p.bob = 0; p.reviveTimer = (p.reviveTimer || 0) + 1;
        if (p.reviveTimer > 360) { p.hp = Math.floor(p.maxHp * 0.5); p.reviveTimer = 0; broadcastParticles(p.x, p.y, 15, '#76ff03', 15, 4); }
        return;
      }
      aliveCount++; p.reviveTimer = 0;

      const inp = remoteInputs[p.id] || { mx: 0, my: 0, jump: false, attack: false, angle: 0, mouseX: 0, mouseY: 0 };
      p.x = Math.max(20, Math.min(canvas.width - 20, p.x + inp.mx * (3.3 + p.speedBonus)));
      p.y = Math.max(40, Math.min(canvas.height - 20, p.y + inp.my * (3.3 + p.speedBonus) * 0.88));
      resolveObstacleCollision(p);

      if (inp.jump && p.z === 0) p.vz = 7.5;
      p.z += p.vz; if (p.z > 0) p.vz -= 0.45; else { p.z = 0; p.vz = 0; }
      p.bob = ((inp.mx !== 0 || inp.my !== 0) && p.z === 0) ? Math.round(Math.abs(Math.sin(walkTick * 0.22)) * 4) : 0;
      p.angle = inp.angle;
      if (p.cooldownTimer > 0) p.cooldownTimer--; if (p.swingAnim > 0) p.swingAnim--;
      if (inp.attack) performPlayerAttack(p, inp);

      // --- 召唤猎犬 AI 更新 ---
      if (p.weaponType === 'staff' && p.dog) {
        if (p.dog.state === 'idle') {
          const dx = p.x - 20 - p.dog.x, dy = p.y + 10 - p.dog.y;
          p.dog.x += dx * 0.12; p.dog.y += dy * 0.12; p.dog.z = p.bob;
          if (Math.abs(dx) > 2 || Math.abs(dy) > 2) p.dog.angle = Math.atan2(dy, dx);
          else p.dog.angle = p.angle;
        } else if (p.dog.state === 'attacking') {
          p.dog.timer--;
          p.dog.x += (p.dog.tx - p.dog.x) * 0.25; p.dog.y += (p.dog.ty - p.dog.y) * 0.25;
          p.dog.z = 8 + Math.sin(p.dog.timer * 0.4) * 12; // 飞扑抛物线
          p.dog.angle = Math.atan2(p.dog.ty - p.dog.y, p.dog.tx - p.dog.x);

          if (p.dog.timer === 8) { // 落地撕咬 AoE
            broadcastParticles(p.dog.x, p.dog.y, 15, '#ff9800', 12, 5);
            enemies.forEach(e => {
              if (Math.hypot(e.x - p.dog.x, e.y - p.dog.y) < 65 + p.rangeBonus) {
                e.hp -= p.dog.dmg; e.hitFlash = 7; e.lastHitBy = p.id;
                const ang = Math.atan2(e.y - p.dog.y, e.x - p.dog.x);
                e.vx = Math.cos(ang) * p.dog.kb; e.vy = Math.sin(ang) * p.dog.kb; e.vz = 5;
              }
            });
          }
          if (p.dog.timer <= 0) p.dog.state = 'idle';
        }
      }
    });

    if (aliveCount === 0 && Object.keys(players).length > 0) {
      Object.values(clientConns).forEach(c => c.open && c.send({ type: 'game_over' }));
      document.getElementById('finalScore').innerText = '小队倒在了第 ' + teamState.wave + ' 波';
      document.getElementById('gameOverModal').style.display = 'flex'; return;
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const { target, dist } = getNearestAlivePlayer(e.x, e.y);
      if (!target) continue;

      const dx = target.x - e.x, dy = target.y - e.y, angle = Math.atan2(dy, dx);
      e.x += e.vx; e.y += e.vy; e.vx *= 0.8; e.vy *= 0.8;
      e.z += e.vz; if (e.z > 0) e.vz -= 0.45; else { e.z = 0; e.vz = 0; }
      if (e.hitFlash > 0) e.hitFlash--;

      if (e.type === 'zombie') {
        e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed * 0.88;
        if (dist < 27 && target.z < 15) target.hp -= 0.35;
      } else if (e.type === 'skeleton') {
        if (dist > 230) { e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed * 0.88; }
        else if (dist < 140) { e.x -= Math.cos(angle) * e.speed * 0.8; e.y -= Math.sin(angle) * e.speed * 0.7; }
        e.shootTimer--;
        if (e.shootTimer <= 0) { e.shootTimer = 105; projectiles.push({ x: e.x, y: e.y, z: 18, vx: Math.cos(angle)*5.5, vy: Math.sin(angle)*5.5, isFriendly: false }); }
      } else if (e.type === 'creeper') {
        if (dist < 65 || e.fuse > 0) { e.fuse++; if (e.fuse > 50) { explodeCreeper(e); enemies.splice(i, 1); continue; } } 
        else { e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed * 0.88; }
      }
      resolveObstacleCollision(e);

      // --- 死亡与概率掉落逻辑 ---
      if (e.hp <= 0) {
        teamState.kills++; xpOrbs.push({ x: Math.round(e.x), y: Math.round(e.y) });
        broadcastParticles(e.x, e.y, 15, '#76ff03', 10, 4);
        
        if (e.lastHitBy && players[e.lastHitBy]) {
          const killer = players[e.lastHitBy];
          if (e.type === 'zombie' && killer.weaponType === 'sword' && killer.weaponTier < 3 && Math.random() < 0.12) {
            const nextWep = 'sword_' + (killer.weaponTier + 1);
            if (!killer.unlockedWeapons.includes(nextWep)) killer.unlockedWeapons.push(nextWep);
          }
          if (e.type === 'skeleton' && Math.random() < 0.15) {
            if (killer.weaponType !== 'bow' && !killer.unlockedWeapons.includes('bow_0')) killer.unlockedWeapons.push('bow_0');
            else if (killer.weaponType === 'bow' && killer.weaponTier === 0 && !killer.unlockedWeapons.includes('bow_1')) killer.unlockedWeapons.push('bow_1');
          }
        }
        enemies.splice(i, 1);
      }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
      const pr = projectiles[i]; pr.x += pr.vx; pr.y += pr.vy;
      let hitWall = false;
      obstacles.forEach(ob => { if (Math.abs(pr.x - ob.x) < ob.w/2 && Math.abs(pr.y - ob.y) < ob.d/2) hitWall = true; });
      if (hitWall) { broadcastParticles(pr.x, pr.y, pr.z, '#bdbdbd', 4, 2); projectiles.splice(i, 1); continue; }

      let hit = false;
      if (pr.isFriendly) {
        enemies.forEach(e => {
          if (e.hp > 0 && Math.hypot(pr.x - e.x, pr.y - e.y) < (e.radius || 13) + 8) {
            e.hp -= pr.dmg; e.hitFlash = 7; e.lastHitBy = pr.ownerId;
            const ang = Math.atan2(pr.vy, pr.vx); e.vx = Math.cos(ang) * pr.kb; e.vy = Math.sin(ang) * pr.kb; e.vz = 4;
            broadcastParticles(e.x, e.y, 15, '#ffeb3b', 6, 3); hit = true;
          }
        });
      } else {
        Object.values(players).forEach(p => {
          if (p.hp > 0 && Math.hypot(pr.x - p.x, pr.y - p.y) < 19 && p.z < 20) { p.hp -= 12; hit = true; broadcastParticles(p.x, p.y, 15, '#ff1744', 6, 4); }
        });
      }
      if (hit || pr.x < 0 || pr.x > canvas.width || pr.y < 0 || pr.y > canvas.height) projectiles.splice(i, 1);
    }

    for (let i = xpOrbs.length - 1; i >= 0; i--) {
      const orb = xpOrbs[i]; const { target, dist } = getNearestAlivePlayer(orb.x, orb.y);
      if (target && dist < 125) { orb.x += (target.x - orb.x) * 0.14; orb.y += (target.y - orb.y) * 0.14; }
      if (target && dist < 22) {
        target.xp++; xpOrbs.splice(i, 1);
        if (target.xp >= target.maxXp) {
          target.lvl++; target.xp = 0; target.maxXp = Math.floor(target.maxXp * 1.4) + 3; target.pendingUpgrades++;
          if (teamState.state === 'BREAK') sendUpgradeOptionsToPlayer(target.id);
        }
      }
    }

    updateHUD();

    syncTick++;
    if (syncTick % 2 === 0) {
      const packet = { type: 'sync', players, enemies, projectiles, xpOrbs, teamState, events: pendingParticleEvents };
      Object.values(clientConns).forEach(conn => { if (conn.open) conn.send(packet); });
      pendingParticleEvents = [];
    }
  }

  function updateHUD() {
    const me = players[myId];
    if (me) {
      document.getElementById('hpText').innerText = Math.max(0, Math.ceil(me.hp)) + '/' + me.maxHp;
      document.getElementById('hpBar').style.width = Math.max(0, (me.hp / me.maxHp) * 100) + '%';
      document.getElementById('lvlText').innerText = me.lvl; document.getElementById('xpBar').style.width = ((me.xp / me.maxXp) * 100) + '%';
    }
    document.getElementById('waveText').innerText = teamState.wave;
    document.getElementById('killText').innerText = teamState.kills;
    document.getElementById('playerCountText').innerText = Object.keys(players).filter(k=>players[k].hp>0).length;

    const breakEl = document.getElementById('breakTimerDisplay');
    const skipBtn = document.getElementById('skipBreakBtn');
    if (teamState.state === 'BREAK') {
      breakEl.style.display = 'inline-block'; breakEl.innerText = `☕ 休整倒计时: ${Math.ceil(teamState.breakTimer / 60)}s`;
      skipBtn.style.display = isHost ? 'inline-block' : 'none';
    } else { breakEl.style.display = 'none'; skipBtn.style.display = 'none'; }
  }

  // ==========================================
  // 渲染层 (增加对各类武器与狗的支持)
  // ==========================================
  function drawVoxelBox(x, y, z, w, d, h, topColor, frontColor, borderColor) {
    const left = x - w / 2, screenY = y - z;
    ctx.lineWidth = 1.5; ctx.strokeStyle = borderColor || '#1a1a1a';
    ctx.fillStyle = frontColor; ctx.fillRect(left, screenY - h, w, h); ctx.strokeRect(left, screenY - h, w, h);
    const topDepth = d * 0.6; ctx.fillStyle = topColor; ctx.fillRect(left, screenY - h - topDepth, w, topDepth); ctx.strokeRect(left, screenY - h - topDepth, w, topDepth);
  }

  function drawPlayerVoxel(p) {
    const z = p.z + (p.bob || 0);
    ctx.save();
    if (p.hp <= 0) ctx.globalAlpha = 0.45;
    const shadowScale = Math.max(0.4, 1 - z / 90);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 14 * shadowScale, 7 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();

    const isAlex = p.skin === 'alex';
    const legTop = isAlex ? '#6d4c41' : '#1e88e5', legFront = isAlex ? '#4e342e' : '#1565c0';
    const bodyTop = isAlex ? '#7cb342' : '#00acc1', bodyFront = isAlex ? '#558b2f' : '#00838f';
    const hairTop = isAlex ? '#ff9800' : '#5d4037';
    drawVoxelBox(p.x, p.y, z, 14, 10, 10, legTop, legFront);
    drawVoxelBox(p.x, p.y, z + 10, 18, 12, 14, bodyTop, bodyFront);
    drawVoxelBox(p.x, p.y, z + 24, 18, 16, 15, hairTop, '#d7ccc8');

    const eyeOffsetX = Math.cos(p.angle) * 4;
    ctx.fillStyle = isAlex ? '#2e7d32' : '#3f51b5';
    ctx.fillRect(p.x + eyeOffsetX - 5, p.y - z - 32, 3, 3); ctx.fillRect(p.x + eyeOffsetX + 2, p.y - z - 32, 3, 3);

    ctx.save();
    ctx.translate(p.x + Math.cos(p.angle)*12, (p.y - z - 18) + Math.sin(p.angle)*8);
    // 不同武器握持与挥动动画
    let rot = p.angle;
    if (p.weaponType === 'sword' && p.swingAnim > 0) rot += Math.sin(p.swingAnim * 0.6) * 1.2;
    else if (p.weaponType === 'staff' && p.swingAnim > 0) rot += Math.sin(p.swingAnim) * 0.5;
    ctx.rotate(rot);

    if (p.weaponType === 'sword') {
      const colors = ['#8d6e63', '#9e9e9e', '#eeeeee', '#00e5ff'], strokes = ['#5d4037', '#616161', '#9e9e9e', '#006064'];
      ctx.fillStyle = colors[p.weaponTier]; ctx.fillRect(0, -3, 22, 6); ctx.strokeStyle = strokes[p.weaponTier]; ctx.strokeRect(0, -3, 22, 6);
    } else if (p.weaponType === 'bow') {
      ctx.strokeStyle = p.weaponTier === 0 ? '#8d6e63' : '#5d4037'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(6, 0, 10, -Math.PI/2, Math.PI/2); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(6, 10); ctx.stroke();
    } else if (p.weaponType === 'staff') {
      ctx.fillStyle = '#795548'; ctx.fillRect(0, -2, 24, 4);
      ctx.fillStyle = '#ffeb3b'; ctx.fillRect(20, -4, 8, 8);
    }
    ctx.restore(); ctx.restore();

    const tagY = p.y - z - 56;
    ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
    ctx.fillStyle = '#000'; ctx.fillText(p.name, p.x + 1, tagY - 7);
    ctx.fillStyle = p.id === myId ? '#76ff03' : '#84ffff'; ctx.fillText(p.name, p.x, tagY - 8);
    if (p.hp <= 0) { ctx.fillStyle = '#ff5252'; ctx.fillText('⏳救援中...', p.x, tagY - 22); }
    else if (p.hp < p.maxHp) { ctx.fillStyle = '#000'; ctx.fillRect(p.x - 16, tagY - 4, 32, 5); ctx.fillStyle = '#76ff03'; ctx.fillRect(p.x - 15, tagY - 3, 30 * (p.hp / p.maxHp), 3); }
  }

  function drawDogVoxel(dog) {
    ctx.save();
    const shadowScale = Math.max(0.4, 1 - dog.z / 90);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(dog.x, dog.y, 10 * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();
    drawVoxelBox(dog.x, dog.y, dog.z, 14, 18, 10, '#d7ccc8', '#bcaaa4'); // 身体
    drawVoxelBox(dog.x + Math.cos(dog.angle)*8, dog.y + Math.sin(dog.angle)*8, dog.z + 6, 10, 10, 10, '#efebe9', '#d7ccc8'); // 头
    if (dog.state === 'attacking') {
      ctx.fillStyle = 'rgba(255,152,0,0.3)'; ctx.beginPath(); ctx.arc(dog.x, dog.y - dog.z - 5, 20, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawEnemyVoxel(e) {
    const bob = Math.abs(Math.sin((walkTick + (e.animOffset || 0)) * 0.18)) * 3.5, z = e.z + bob;
    const shadowScale = Math.max(0.4, 1 - z / 90);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(e.x, e.y, 14 * shadowScale, 7 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();

    const f = e.hitFlash > 0;
    if (e.type === 'zombie') {
      drawVoxelBox(e.x, e.y, z, 14, 10, 10, f ? '#ff8a80' : '#3949ab', f ? '#ff1744' : '#283593');
      drawVoxelBox(e.x, e.y, z + 10, 18, 12, 14, f ? '#ff8a80' : '#00897b', f ? '#ff1744' : '#00695c');
      drawVoxelBox(e.x, e.y, z + 24, 18, 16, 15, f ? '#ff8a80' : '#66bb6a', f ? '#ff1744' : '#43a047');
      ctx.fillStyle = '#111'; ctx.fillRect(e.x - 5, e.y - z - 32, 4, 3); ctx.fillRect(e.x + 2, e.y - z - 32, 4, 3);
    } else if (e.type === 'skeleton') {
      drawVoxelBox(e.x, e.y, z, 10, 8, 11, f ? '#ff8a80' : '#eeeeee', f ? '#ff1744' : '#bdbdbd');
      drawVoxelBox(e.x, e.y, z + 11, 14, 10, 13, f ? '#ff8a80' : '#f5f5f5', f ? '#ff1744' : '#cfcfcf');
      drawVoxelBox(e.x, e.y, z + 24, 17, 15, 15, f ? '#ff8a80' : '#ffffff', f ? '#ff1744' : '#e0e0e0');
      ctx.fillStyle = '#222'; ctx.fillRect(e.x - 5, e.y - z - 33, 4, 3); ctx.fillRect(e.x + 2, e.y - z - 33, 4, 3);
    } else if (e.type === 'creeper') {
      const fw = (e.fuse > 0 && Math.floor(e.fuse / 4) % 2 === 0);
      const topC = f ? '#ff8a80' : (fw ? '#ffffff' : '#69f0ae'), frontC = f ? '#ff1744' : (fw ? '#eeeeee' : '#00c853');
      const sw = e.fuse > 0 ? Math.floor((e.fuse / 50) * 5) : 0;
      drawVoxelBox(e.x, e.y, z, 16 + sw, 14 + sw, 8, topC, frontC);
      drawVoxelBox(e.x, e.y, z + 8, 14 + sw, 12 + sw, 16, topC, frontC);
      drawVoxelBox(e.x, e.y, z + 24, 18 + sw, 16 + sw, 16 + sw, topC, frontC);
      ctx.fillStyle = '#111'; ctx.fillRect(e.x - 5, e.y - z - 35, 3, 4); ctx.fillRect(e.x + 2, e.y - z - 35, 3, 4); ctx.fillRect(e.x - 3, e.y - z - 30, 6, 5);
    }
    if (e.hp < e.maxHp) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x - 15, e.y - z - 55, 30, 6); ctx.fillStyle = '#ff1744'; ctx.fillRect(e.x - 14, e.y - z - 54, 28 * (e.hp / e.maxHp), 4);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const tileW = 60, tileH = 42;
    for (let r = 0; r < canvas.height / tileH + 1; r++) {
      for (let c = 0; c < canvas.width / tileW + 1; c++) {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#4b702c' : '#446627'; ctx.fillRect(c * tileW, r * tileH, tileW, tileH);
      }
    }

    Object.values(players).forEach(p => {
      if (p.weaponType === 'sword' && p.swingAnim > 0 && p.hp > 0) {
        ctx.save(); ctx.translate(p.x, p.y - p.z - 16); ctx.scale(1, 0.72); ctx.rotate(p.angle);
        const arc = Math.PI * WEAPONS.sword[p.weaponTier].arc + p.arcBonus;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 75 + p.rangeBonus, -arc / 2, arc / 2); ctx.closePath();
        ctx.fillStyle = 'rgba(0, 229, 255, ' + (p.swingAnim / 14) + ')'; ctx.fill(); ctx.strokeStyle = '#84ffff'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
      }
    });

    const renderList = [];
    obstacles.forEach(ob => {
      renderList.push({
        y: ob.y, draw: () => {
          ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(ob.x, ob.y, ob.w * 0.65, ob.d * 0.4, 0, 0, Math.PI * 2); ctx.fill();
          if (ob.type === 'pillar') { drawVoxelBox(ob.x, ob.y, 0, ob.w, ob.d, ob.h, '#9e9e9e', '#616161'); drawVoxelBox(ob.x, ob.y, ob.h, ob.w - 8, ob.d - 6, 10, '#bdbdbd', '#757575'); }
          else { drawVoxelBox(ob.x, ob.y, 0, 18, 16, 28, '#8d6e63', '#5d4037'); drawVoxelBox(ob.x, ob.y, 26, 52, 42, 26, '#66bb6a', '#2e7d32'); drawVoxelBox(ob.x, ob.y, 52, 34, 28, 18, '#81c784', '#388e3c'); }
        }
      });
    });

    xpOrbs.forEach(orb => {
      renderList.push({
        y: orb.y, draw: () => {
          const floatZ = 6 + Math.sin(walkTick * 0.15) * 3;
          ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(orb.x - 4, orb.y - 2, 8, 4);
          drawVoxelBox(orb.x, orb.y, floatZ, 8, 8, 8, '#ffffff', (Date.now() % 400 < 200) ? '#76ff03' : '#ffeb3b');
        }
      });
    });

    Object.values(players).forEach(p => {
      renderList.push({ y: p.y, draw: () => drawPlayerVoxel(p) });
      if (p.weaponType === 'staff' && p.dog) {
        renderList.push({ y: p.dog.y, draw: () => drawDogVoxel(p.dog) });
      }
    });
    enemies.forEach(e => renderList.push({ y: e.y, draw: () => drawEnemyVoxel(e) }));
    
    projectiles.forEach(pr => {
      renderList.push({
        y: pr.y, draw: () => { 
          if (pr.isFriendly) {
            ctx.save(); ctx.translate(pr.x, pr.y - pr.z); ctx.rotate(Math.atan2(pr.vy, pr.vx));
            ctx.fillStyle = '#795548'; ctx.fillRect(-6, -1, 12, 2); ctx.fillStyle = '#fff'; ctx.fillRect(4, -2, 4, 4);
            ctx.restore();
          } else {
            ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(pr.x - 3, pr.y, 6, 3); drawVoxelBox(pr.x, pr.y, pr.z, 7, 7, 5, '#ffffff', '#cfd8dc'); 
          }
        }
      });
    });

    renderList.sort((a, b) => a.y - b.y).forEach(item => item.draw());
    particles.forEach(pt => { ctx.fillStyle = pt.color; ctx.fillRect(pt.x - 3, pt.y - pt.z - 3, 6, 6); });
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
};
</script>
